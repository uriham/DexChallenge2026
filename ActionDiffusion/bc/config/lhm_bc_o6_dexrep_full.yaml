seed: 42

clip_observations: 5.0
clip_actions: 1.0

name: train_lhm_bc_o6_dexrep_full
task_name: grasp
exp_name: "o6_dexrep_full"
exp_dir: ../ActionDiffusion/bc/saved_models

train_data_dir: /data/handchallenge_preproc/train
test_data_dir: /data/handchallenge_preproc/valid

grasm3_root_dir: ./graspm3_structured
load_traj_info: False

train_obj_code_list:

batch_size: 128
num_epochs: 200

add_noise: False
noise_val: 0.05
seq_num: 999999
val_seq_num: -1
obs_type: "dexrep"

seq_normalize: True
num_frame: 80

batch_seq_flat: True
start_frame_pad: False

use_sim_action: False
infer_clip_sample: True

lr: 2e-4
obs_dim: 77
o6_obs_mode: "dexrep"
dexrep_sensor_dim: 1040
dexrep_pnl_dim: 640
horizon: 1

train_runtime:
  resume_ckpt: null
  exp_suffix: o6_75preprocessed_dexrep_200ep_seed42_bestlast
  num_epochs: 200
  batch_size: 128
  num_workers: 8
  train_data_dir: /data/handchallenge_preproc/train
  test_data_dir: /data/handchallenge_preproc/valid
  seq_num: 999999
  val_seq_num: -1
  train_obj_code_list: null
  obs_dim: 77
  o6_obs_mode: dexrep
  dexrep_sensor_dim: 1040
  dexrep_pnl_dim: 640
  policy_actor_critic: ActorCriticDexRepTemporalTCN
  temporal_history: 8
  tcn_dropout: 0.05
  tcn_kernel_size: 3
  tcn_dilations: [1, 2]
  object_balanced_sampler: false
  sampler_seed: null
  check_val_every_n_epoch: 1
  save_best_ckpt: true
  best_monitor: val_loss
  best_mode: min
  ckpt_every_n_epochs: null
  save_epoch_ckpt: false
  save_final_ckpt: true
  train_seed: 42
  deterministic: true

obj_glob_feat_file: ./object_code_glob_feat.npy

policy:
  actor_critic: 'ActorCriticDexRepTemporalTCN'
  pi_hid_sizes: [1024, 1024, 512, 512]
  vf_hid_sizes: [1024, 1024, 512, 512]
  activation: elu
  actions_shape: 12
  checkpoints: ../ActionDiffusion/bc/saved_models/1obj_seq2000_DexRep_pro77_start_uniform_vis_action_dsam_mod_o6_75preprocessed_dexrep/epoch=199-step=84800.ckpt

encoder:
  name: t20-retac-tmr05-bin-ft+dataset-BottleCap
  pretrain_dir: "model/vitac/model_and_config"
  freeze: True
  emb_dim: 128
  en_mode: patch
  f_ex_mode: null
  n_obs_steps: 8
  tcn_dropout: 0.05
  tcn_kernel_size: 3
  tcn_dilations: [1, 2]
  bn_type: "part"

learn:
  agent_name: shadow_hand
  test: False
  resume: 0
  save_interval: 1000
  print_log: True
  max_iterations: 10000000
  cliprange: 0.2
  ent_coef: 0
  nsteps: 8
  noptepochs: 5
  nminibatches: 4
  max_grad_norm: 1
  optim_stepsize: 3.e-4
  schedule: adaptive
  desired_kl: 0.016
  gamma: 0.96
  lam: 0.95
  init_noise_std: 0.8
  log_interval: 1
  asymmetric: False

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

logging:
  group: ${exp_name}
  id: null
  mode: offline
  name: ${training.seed}
  project: lhm_bc
  resume: true
  tags:
  - lhm_bc_o6_dexrep_full
